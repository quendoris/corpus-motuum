name: Publish 1.x release tags

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-1x-tags.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable 1.0 and 1.1 release tags
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tag in v1.0.0 v1.1.0; do
            remote_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            if [[ -n "$remote_sha" ]]; then
              if [[ "$remote_sha" != "$TARGET_SHA" ]]; then
                echo "$tag already exists at $remote_sha, expected $TARGET_SHA" >&2
                exit 1
              fi
              echo "$tag already points at validated main $TARGET_SHA"
              continue
            fi
            git tag "$tag" "$TARGET_SHA"
            git push origin "refs/tags/$tag"
          done

          echo "release tags created at $TARGET_SHA"

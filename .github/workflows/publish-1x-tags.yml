name: Publish 1.x release tags

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-1x-tags.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable release tags
        run: |
          set -euo pipefail
          git fetch --tags --force
          for tag in v1.0.0 v1.1.0; do
            if ! git rev-parse --verify "$tag^{commit}" >/dev/null 2>&1; then
              echo "required release tag is missing: $tag" >&2
              exit 1
            fi
            tagged_sha="$(git rev-parse "$tag^{commit}")"
            if ! git merge-base --is-ancestor "$tagged_sha" "$GITHUB_SHA"; then
              echo "$tag points outside current main history: $tagged_sha" >&2
              exit 1
            fi
            echo "$tag -> $tagged_sha"
          done

      - name: Dispatch publication builds on both tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in v1.0.0 v1.1.0; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "GitHub Release $tag already exists; skipping dispatch"
              continue
            fi
            gh workflow run release-1x.yml --ref "$tag"
            echo "dispatched release-1x.yml for $tag"
          done

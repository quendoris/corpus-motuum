name: Exercise v1 pilot source materialization

on:
  push:
    branches:
      - 'stage/exercise-v1'
    paths:
      - 'corpus/exercises/pilot-v1.json'
      - 'schemas/exercise-v1.schema.json'
      - 'tools/extract_exercise_pilot_sources.py'
      - 'corpus/text/pages/**'
      - 'corpus/source/page-manifest.json'
      - '.github/workflows/exercise-v1-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exercise-v1-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install schema validator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'jsonschema>=4.23,<5'

      - name: Materialize exact pilot source spans
        run: |
          set -euo pipefail
          rm -rf corpus/exercises/items
          python tools/extract_exercise_pilot_sources.py

      - name: Validate all Exercise v1 draft records
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("schemas/exercise-v1.schema.json").read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          paths = sorted(Path("corpus/exercises/items").glob("EX-*.json"))
          if len(paths) != 16:
              raise SystemExit(f"expected 16 pilot records, got {len(paths)}")
          for path in paths:
              record = json.loads(path.read_text(encoding="utf-8"))
              errors = sorted(validator.iter_errors(record), key=lambda e: list(e.absolute_path))
              if errors:
                  rendered = "\n".join(
                      f"{path}: {'/'.join(map(str, error.absolute_path))}: {error.message}"
                      for error in errors
                  )
                  raise SystemExit(rendered)
              if record["identity"]["status"] != "draft":
                  raise SystemExit(f"{path}: source materialization may only create draft records")
              if record["anatomy"]["relations"] or record["evidence"]["claims"]:
                  raise SystemExit(f"{path}: source materialization may not invent derived claims")
          print(f"validated Exercise v1 pilot source drafts: {len(paths)}/16")
          PY

      - name: Verify deterministic second pass
        run: |
          set -euo pipefail
          python tools/extract_exercise_pilot_sources.py --check

      - name: Commit source-only pilot records if changed
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/exercises/items
          if git diff --cached --quiet; then
            echo "pilot source records already current"
            exit 0
          fi
          git commit -m "exercise: materialize pilot source spans"
          git push origin HEAD:stage/exercise-v1

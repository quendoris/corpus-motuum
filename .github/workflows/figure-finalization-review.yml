name: Figure finalization review

on:
  push:
    branches:
      - 'figures/model-v1'
    paths:
      - '.github/workflows/figure-finalization-review.yml'
      - 'tools/extract_book_pages.py'
      - 'tools/probe_figure_segmentation.py'
      - 'tools/audit_figure_census.py'
      - 'tools/build_figure_review_set.py'
      - 'tools/compose_figure_assets.py'
      - 'tools/build_figure_finalization_review.py'
      - 'tools/build_manual_figure_assets.py'
      - 'tools/build_final_figure_set.py'
      - 'tools/build_final_figure_review.py'
      - 'corpus/figures/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: figure-finalization-review
  cancel-in-progress: false

jobs:
  build-review:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'figures: freeze canonical figure set') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source and Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install image pipeline dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils git-lfs rsync
          python -m pip install --upgrade pip
          python -m pip install numpy pillow opencv-python-headless pymupdf

      - name: Verify immutable Russian source PDF
        run: |
          set -euo pipefail
          git lfs pull
          sha256sum -c sources/source-001/raw/original.pdf.sha256

      - name: Download and verify public-domain reference PDF
        run: |
          set -euo pipefail
          mkdir -p work/reference
          curl --fail --location --retry 5 --retry-delay 3 \
            https://iiif.wellcomecollection.org/pdf/b29287078 \
            --output work/reference/b29287078.pdf
          echo "282fc264a3dcad02d300f8e07937542cfc8dc165f03fec2b57c1a2549004c503  work/reference/b29287078.pdf" \
            | sha256sum -c -

      - name: Extract all 600 physical pages
        run: |
          set -euo pipefail
          python tools/extract_book_pages.py \
            sources/source-001/raw/original.pdf \
            --out work/book-final/pages \
            --manifest-out work/book-final/page-manifest.json

      - name: Verify extraction against committed source manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(Path("corpus/source/page-manifest.json").read_text())
          actual = json.loads(Path("work/book-final/page-manifest.json").read_text())
          fields = (
              "id",
              "physical_index",
              "source_pdf_sheet",
              "spread_side",
              "width",
              "height",
              "sha256",
              "extraction_method",
          )
          left = [{key: row.get(key) for key in fields} for row in expected["records"]]
          right = [{key: row.get(key) for key in fields} for row in actual["records"]]
          if left != right:
              raise SystemExit("regenerated page manifest differs from committed source manifest")
          if len(right) != 600:
              raise SystemExit(f"expected 600 physical pages, got {len(right)}")
          print("page manifest: 600/600 exact")
          PY

      - name: Extract physical figure evidence
        run: |
          set -euo pipefail
          python tools/probe_figure_segmentation.py \
            work/book-final/pages \
            --out work/figure-structure-final

      - name: Audit and curate detector output
        run: |
          set -euo pipefail
          python tools/audit_figure_census.py \
            --index work/figure-structure-final/index.json \
            --metrics-root work/figure-structure-final \
            --out work/figure-structure-final/census-audit
          python tools/build_figure_review_set.py \
            --audit work/figure-structure-final/census-audit/figure-census-audit.json \
            --source-root work/figure-structure-final \
            --out work/figure-review-final \
            --mode hardlink

      - name: Render declared logical layouts
        run: |
          set -euo pipefail
          python tools/compose_figure_assets.py batch \
            --source-root work/figure-structure-final \
            --out-root work/figure-logical-final

      - name: Render restored and manually declared assets
        run: |
          set -euo pipefail
          python tools/build_manual_figure_assets.py \
            --page-root work/book-final/pages \
            --structure-root work/figure-structure-final \
            --reference-pdf work/reference/b29287078.pdf \
            --out-root work/figure-manual-final

      - name: Assemble complete final figure set
        run: |
          set -euo pipefail
          python tools/build_final_figure_set.py \
            --review-manifest work/figure-review-final/manifest.json \
            --logical-manifest work/figure-logical-final/compositions-manifest.json \
            --manual-manifest work/figure-manual-final/manifest.json \
            --out-root work/figure-final-v1

      - name: Verify canonical figure census
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("work/figure-final-v1/manifest.json").read_text())
          expected = {"numbered": 158, "atlas": 6, "paratext": 4}
          actual = {key: len(manifest.get(key, [])) for key in expected}
          if actual != expected:
              raise SystemExit(f"canonical figure census mismatch: expected {expected}, got {actual}")
          print(f"canonical figures: {actual}")
          PY

      - name: Run regression tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Build compact visual reviews
        run: |
          set -euo pipefail
          python tools/build_figure_finalization_review.py \
            --page-root work/book-final/pages \
            --structure-root work/figure-structure-final \
            --review-root work/figure-review-final \
            --logical-root work/figure-logical-final \
            --out review/finalization-v1
          python tools/build_final_figure_review.py \
            --final-root work/figure-final-v1 \
            --out review/final-figure-set-v1

      - name: Materialize canonical figure payload
        run: |
          set -euo pipefail
          mkdir -p corpus/figures/assets/v1
          rsync -a --delete work/figure-final-v1/ corpus/figures/assets/v1/

          # Only genuinely large individual files use Git LFS. Small images and
          # manifests remain ordinary Git objects.
          while IFS= read -r -d '' file; do
            git lfs track "$file"
          done < <(find corpus/figures/assets/v1 -type f -size +5M -print0)

      - name: Upload complete final figure set
        uses: actions/upload-artifact@v4
        with:
          name: figure-final-v1
          path: work/figure-final-v1
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload reproducible diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: figure-finalization-diagnostics-v1
          path: |
            work/figure-manual-final
            review/finalization-v1
            review/final-figure-set-v1
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Commit canonical figure payload and compact QA
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .gitattributes \
            corpus/figures/assets/v1 \
            review/finalization-v1 \
            review/final-figure-set-v1
          git lfs ls-files || true
          if git diff --cached --quiet; then
            echo "No canonical figure changes to commit."
          else
            git commit -m "figures: freeze canonical figure set"
            git push origin HEAD:figures/model-v1
          fi

name: Source PDF preflight

on:
  push:
    branches: [main]
    paths:
      - 'sources/source-001/raw/original.pdf'
      - 'sources/source-001/raw/original.pdf.sha256'
      - 'tools/source_preflight.sh'
      - '.github/workflows/source-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf

      - name: Verify LFS object
        run: |
          git lfs pull
          ls -lh sources/source-001/raw/original.pdf

      - name: Run source preflight
        run: |
          chmod +x tools/source_preflight.sh
          tools/source_preflight.sh

      - name: Commit textual audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/source-001/audit
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "audit: record source PDF preflight"
            git push
          fi
